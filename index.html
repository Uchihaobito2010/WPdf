<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Image → PDF Studio</title>

  <link rel="stylesheet" href="style.css">

  <!-- libs -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>

<div class="app">

  <h1>Image → PDF Studio</h1>

  <!-- PDF NAME -->
  <input
    id="pdfName"
    type="text"
    placeholder="PDF file name (without .pdf)"
    value="my-pdf"
  >

  <!-- IMAGE INPUT -->
  <input
    type="file"
    id="imageInput"
    accept="image/*"
    multiple
  >

  <!-- PREVIEW -->
  <div id="preview" class="preview"></div>

  <!-- CONTROLS -->
  <div class="controls">
    <label>Position X</label>
    <input type="range" id="posX" min="-80" max="80" value="0">

    <label>Position Y</label>
    <input type="range" id="posY" min="-80" max="80" value="0">

    <label>Scale</label>
    <input type="range" id="scale" min="50" max="150" value="100">

    <label>Rotate</label>
    <select id="rotate">
      <option value="0">0°</option>
      <option value="90">90°</option>
      <option value="180">180°</option>
      <option value="270">270°</option>
    </select>
  </div>

  <button id="createBtn">Create PDF</button>

  <footer class="footer">
    <a href="https://instagram.com/pa74s" target="_blank">
      <img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/instagram.svg">
    </a>
    <a href="https://t.me/Aotpy" target="_blank">
      <img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/telegram.svg">
    </a>
    <span>© 2025 Paras Chourasiya</span>
  </footer>

</div>

<script src="script.js"></script>
</body>
</html>
